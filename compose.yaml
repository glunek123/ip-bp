name: dev-cor
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_USER: dev_cor
      POSTGRES_DB: dev_cor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local first}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev_cor -d dev_cor']
      interval: 3s
      timeout: 3s
      retries: 20
  postgres-test:
    profiles: ['test']
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_USER: dev_cor_test
      POSTGRES_DB: dev_cor_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Run pnpm setup:local first}
    ports:
      - '127.0.0.1:55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev_cor_test -d dev_cor_test']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
