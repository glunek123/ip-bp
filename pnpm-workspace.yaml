packages:
  - frontend
  - backend

verifyDepsBeforeRun: error
minimumReleaseAgeStrict: true

allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': true
  '@prisma/client': false
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.4'
  - '@nestjs/core@11.2.4'
  - '@nestjs/platform-express@11.2.4'
  - '@nestjs/testing@11.2.4'
  - '@vitejs/plugin-vue@6.0.9'
