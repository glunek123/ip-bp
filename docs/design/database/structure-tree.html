.b-uk{background:#f0eafb;color:#5b3fa8}

var tree = document.getElementById('tree');
var countEl = document.getElementById('count');
var emptyEl = document.getElementById('empty');
var q = document.getElementById('q');
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

var frag = document.createDocumentFragment();
var allTables = [];
DATA.forEach(function(pair){
  var modName = pair[0], list = pair[1];
  var sec = document.createElement('section');
  sec.className = 'mod open';
  sec.dataset.total = list.length;
  var mh = document.createElement('div');
  mh.className = 'mh';
  mh.innerHTML = '<span class="mt">' + esc(modName) + '</span>'
    + '<span class="mc">' + list.length + ' 张表</span>';
  mh.addEventListener('click', function(){ sec.classList.toggle('open'); });
  var body = document.createElement('div');
  body.className = 'body';
  list.forEach(function(t){
    var table = t[0], cn = t[1], refs = t[2], cols = t[3];
    var box = document.createElement('div');
    box.className = 'tbl'; box.id = 'tb-' + table;
    box.dataset.name = (table + ' ' + cn).toLowerCase();
    box.dataset.fields = cols.map(function(c){ return c[0] + ' ' + (c[2]||''); }).join(' ').toLowerCase();
    var row = document.createElement('div');
    row.className = 'trow';
    var refTxt = refs ? '<span class="tref">被 ' + refs + ' 处引用</span>' : '';
    row.innerHTML = '<span class="caret"></span>'
      + '<span class="tname">' + esc(table) + '</span>'
      + '<span class="tcn">' + esc(cn) + '</span>' + refTxt
      + '<span class="tnum">' + cols.length + ' 字段</span>';
    row.addEventListener('click', function(){ box.classList.toggle('open'); });
    var fl = document.createElement('div');
    fl.className = 'fields';
    cols.forEach(function(c){
      var el = document.createElement('div');
      el.className = 'f';
      el.dataset.f = (c[0] + ' ' + (c[2]||'')).toLowerCase();
      var flag = c[3];
      var slot = function(h){ return '<span>' + h + '</span>'; };
      var badges = slot(flag & 1 ? '<span class="badge b-pk">PK</span>' : '')
        + slot(flag & 2 ? '<span class="badge b-uk">UK</span>' : '')
        + slot(flag & 4 ? '<span class="badge b-null">可空</span>' : '');
      var fk = c[4] ? '<span class="fk" data-goto="' + esc(c[4].split('.')[0]) + '">&rarr; ' + esc(c[4]) + '</span>' : '';
      el.innerHTML = '<span class="fname" title="' + esc(c[0]) + '">' + esc(c[0]) + '</span>'
        + '<span class="fcn" title="' + esc(c[2]||'') + '">' + esc(c[2]||'') + '</span>'
        + '<span class="ftype" title="' + esc(c[1]) + '">' + esc(c[1]) + '</span>'
        + '<span class="marks">' + badges + fk + '</span>';
      fl.appendChild(el);
    });
    box.appendChild(row); box.appendChild(fl); body.appendChild(box);
    allTables.push(box);
  });
  sec.appendChild(mh); sec.appendChild(body); frag.appendChild(sec);
});
tree.appendChild(frag);

tree.addEventListener('click', function(e){
  var fk = e.target.closest('.fk');
  if (!fk) return;
  e.stopPropagation();
  var box = document.getElementById('tb-' + fk.dataset.goto);
  if (!box) return;
  var p = box.parentNode;
  while (p && p !== tree) { if (p.classList && p.classList.contains('mod')) p.classList.add('open'); p = p.parentNode; }
  box.classList.add('open');
  box.scrollIntoView({behavior:'smooth', block:'center'});
  var r = box.querySelector('.trow');
  r.style.background = '#fff3bf';
  setTimeout(function(){ r.style.background = ''; }, 1200);
});

function updateCount(){
  var shown = allTables.filter(function(b){ return !b.classList.contains('hidden'); }).length;
  countEl.textContent = shown + ' / ' + allTables.length + ' 张表';
}
function clearMarks(){
  tree.querySelectorAll('mark').forEach(function(m){
    var p = m.parentNode;
    p.replaceChild(document.createTextNode(m.textContent), m);
    p.normalize();
  });
}
function markIn(el, kw){
  if (!el) return;
  var raw = el.textContent, i = raw.toLowerCase().indexOf(kw);
  if (i < 0) return;
  el.textContent = '';
  el.append(raw.slice(0, i));
  var m = document.createElement('mark');
  m.textContent = raw.slice(i, i + kw.length);
  el.append(m, raw.slice(i + kw.length));
}

q.addEventListener('input', function(){
  var kw = q.value.trim().toLowerCase();
  clearMarks();
  if (!kw) {
    allTables.forEach(function(b){ b.classList.remove('hidden','open'); });
    tree.querySelectorAll('.mod').forEach(function(m){
      m.classList.remove('hidden'); m.classList.add('open');
      m.querySelector('.mc').textContent = m.dataset.total + ' 张表';
    });
    emptyEl.classList.add('hidden');
    updateCount();
    return;
  }
  var hits = 0;
  tree.querySelectorAll('.mod').forEach(function(sec){
    var modHits = 0;
    sec.querySelectorAll('.tbl').forEach(function(box){
      var inTable = box.dataset.name.indexOf(kw) >= 0;
      var inField = box.dataset.fields.indexOf(kw) >= 0;
      if (!inTable && !inField) { box.classList.add('hidden'); box.classList.remove('open'); return; }
      modHits++; hits++;
      box.classList.remove('hidden');
      if (inTable) { box.classList.add('open'); markIn(box.querySelector('.tname'), kw); }
      else box.classList.remove('open');
      box.querySelectorAll('.f').forEach(function(f){
        if (f.dataset.f.indexOf(kw) >= 0) {
          box.classList.add('open');
          markIn(f.querySelector('.fname'), kw);
          markIn(f.querySelector('.fcn'), kw);
        }
      });
    });
    sec.classList.toggle('hidden', modHits === 0);
    if (modHits) sec.classList.add('open');
    sec.querySelector('.mc').textContent = modHits === Number(sec.dataset.total)
      ? sec.dataset.total + ' 张表' : modHits + ' / ' + sec.dataset.total + ' 张表';
  });
  emptyEl.classList.toggle('hidden', hits > 0);
  updateCount();
});

document.getElementById('expandAll').onclick = function(){
  allTables.forEach(function(b){ if (!b.classList.contains('hidden')) b.classList.add('open'); });
};
document.getElementById('collapseAll').onclick = function(){
  allTables.forEach(function(b){ b.classList.remove('open'); });
};
updateCount();
</script>
