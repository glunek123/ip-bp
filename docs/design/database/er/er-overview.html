function esc(v) {
  return String(v).replace(/[&<>]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
  });
}
function render(table) {
  var f = FIELDS[table];
  if (!f) return '';
  var head = '<div class="dh"><b>' + esc(table) + '</b><span>' + esc(f.cn)
    + ' · ' + f.cols.length + ' 字段</span>'
    + '<button type="button" data-close="1" aria-label="收起">&times;</button></div>';
  var rows = f.cols.map(function (c) {
    var mark = c[3] === 1 ? '<span class="pk">PK</span>'
             : c[3] === 2 ? '<span class="pk">UK</span>' : '';
    var nul = c[4] ? '<span class="pk" style="color:#B0B8C0">可空</span>' : '';
    return '<div class="dr"><span class="dn" title="' + esc(c[0]) + '">' + esc(c[0]) + '</span>'
      + '<span class="dt">' + esc(c[1]) + '</span>'
      + '<span class="dc" title="' + esc(c[2] || '') + '">' + esc(c[2] || '—') + mark + nul + '</span></div>';
  }).join('');
  return head + '<div class="db">' + rows + '</div>';
}
document.querySelectorAll('.node').forEach(function (g) {
  g.addEventListener('click', function () {
    var sec = g.closest('section');
    var box = sec.querySelector('.detail');
    var t = g.getAttribute('data-table');
    var same = box.classList.contains('open') && box.getAttribute('data-cur') === t;
    document.querySelectorAll('.node.sel').forEach(function (n) { n.classList.remove('sel'); });
    if (same) {
      box.classList.remove('open');
      box.removeAttribute('data-cur');
      return;
    }
    box.innerHTML = render(t);
    box.setAttribute('data-cur', t);
    box.classList.add('open');
    g.classList.add('sel');
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  g.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); g.click(); }
  });
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('[data-close]')) return;
  var box = e.target.closest('.detail');
  box.classList.remove('open');
  box.removeAttribute('data-cur');
  document.querySelectorAll('.node.sel').forEach(function (n) { n.classList.remove('sel'); });
});
